<!-- ★ FLOATING CART (Desktop) -->
<div class="floating-cart" id="floating-cart">
  <button class="floating-cart-btn" onclick="toggleCartDrawer()" id="floating-cart-btn">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="floating-cart-badge" id="floating-cart-count">{{ cart_count }}</span>
  </button>
</div>

<!-- Cart Sidebar Drawer -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-drawer-header">
    <h3>🛒 My Cart (<span id="drawer-item-count">{{ cart_count }}</span> items)</h3>
    <button onclick="toggleCartDrawer()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="cart-drawer-body" id="cart-drawer-body">
    <div class="cart-empty-state">
      <div style="font-size: 3rem;">🛒</div>
      <p>Your cart is empty!</p>
      <a href="/shop/" class="btn btn-primary btn-sm">Start Shopping</a>
    </div>
  </div>
  <div class="cart-drawer-footer">
    <div class="cart-total-row">
      <span>Total:</span>
      <span class="cart-total-amount" id="drawer-total">₹{{ cart_total }}</span>
    </div>
    <a href="/checkout/" class="btn btn-primary btn-full">Proceed to Checkout →</a>
  </div>
</div>
<div class="cart-drawer-overlay" id="cart-overlay" onclick="toggleCartDrawer()"></div>
